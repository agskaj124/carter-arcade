
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Carter Arcade</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:25px 15px;text-align:center;
 background:#160609;border-bottom:2px solid #ff263f;
}
header h1{color:#ff3048;font-size:30px;margin:0}
header p{color:#aaa;margin-bottom:0}
main{max-width:850px;margin:auto;padding:18px}
h2{color:#ff4055}
input{
 width:100%;padding:15px;border-radius:12px;
 background:#171717;color:white;
 border:1px solid #812333;font-size:16px;
 margin-bottom:20px;
}
.games{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;
}
.game{
 background:#171717;border:1px solid #67202d;
 border-radius:15px;padding:20px 10px;
 text-align:center;
}
.emoji{font-size:45px}
.game h3{margin:10px 0 15px}
button{
 background:#e5223b;color:white;border:0;
 border-radius:10px;padding:13px 18px;
 font-size:15px;font-weight:bold;
 cursor:pointer;touch-action:manipulation;
}
.game button{width:100%}
button:active{transform:scale(.96)}
#playArea{
 display:none;margin-top:22px;padding:18px;
 background:#171717;border:1px solid #8b2635;
 border-radius:15px;text-align:center;
}
canvas{
 width:100%;max-width:360px;
 height:auto;background:black;
 border-radius:10px;touch-action:none;
}
.controls{
 display:grid;grid-template-columns:repeat(3,65px);
 justify-content:center;gap:8px;margin:18px auto;
}
.controls button{height:55px;padding:5px;font-size:22px}
.empty{visibility:hidden}
#message{color:#ff8995;min-height:24px}
footer{text-align:center;color:#777;padding:30px}
@media(min-width:600px){
 .games{grid-template-columns:repeat(3,1fr)}
 main{padding:28px}
}
</style>
</head>
<body>

<header>
<h1>🎮 CARTER ARCADE</h1>
<p>YOUR ONLINE GAMING WORLD</p>
</header>

<main>
<h2>Game Library</h2>
<input id="search" placeholder="🔎 Search games..." oninput="filterGames()">

<div class="games" id="games">
 <div class="game" data-name="Snake">
  <div class="emoji">🐍</div>
  <h3>Snake</h3>
  <button onclick="startSnake()">PLAY</button>
 </div>
 <div class="game" data-name="Reaction">
  <div class="emoji">⚡</div>
  <h3>Reaction Test</h3>
  <button onclick="startReaction()">PLAY</button>
 </div>
 <div class="game" data-name="Pong">
  <div class="emoji">🏓</div>
  <h3>Pong</h3>
  <button onclick="startPong()">PLAY</button>
 </div>
 <div class="game" data-name="Tap">
  <div class="emoji">🎯</div>
  <h3>Tap Challenge</h3>
  <button onclick="startTap()">PLAY</button>
 </div>
</div>

<section id="playArea">
 <h2 id="gameTitle">Game</h2>
 <p id="instructions"></p>
 <canvas id="canvas" width="320" height="320"></canvas>
 <div id="controls"></div>
 <p id="message"></p>
 <button onclick="stopGame()">CLOSE GAME</button>
</section>
</main>

<footer>© 2026 CARTER ARCADE</footer>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const area=document.getElementById("playArea");
let timer=null,game=null,cleanup=()=>{};

function filterGames(){
 const q=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".game").forEach(c=>{
  c.style.display=c.dataset.name.toLowerCase().includes(q)?"block":"none";
 });
}
function showGame(name,instructions){
 stopGame();
 game=name;
 area.style.display="block";
 document.getElementById("gameTitle").textContent=name;
 document.getElementById("instructions").textContent=instructions;
 document.getElementById("message").textContent="";
 document.getElementById("controls").innerHTML="";
 document.getElementById("playArea").scrollIntoView({behavior:"smooth"});
}
function stopGame(){
 clearInterval(timer);
 timer=null;
 cleanup();
 cleanup=()=>{};
 game=null;
 area.style.display="none";
}
function drawButtons(){
 const c=document.getElementById("controls");
 c.innerHTML=`
 <div class="controls">
 <span class="empty"></span>
 <button data-dir="up">▲</button>
 <span class="empty"></span>
 <button data-dir="left">◀</button>
 <button data-dir="down">▼</button>
 <button data-dir="right">▶</button>
 </div>`;
}

function startSnake(){
 showGame("Snake","Eat the red food. Don't hit the walls!");
 drawButtons();
 let snake=[{x:8,y:8}],dir={x:1,y:0};
 let food={x:12,y:8},score=0,alive=true;
 function direction(d){
  if(d==="up"&&dir.y!==1)dir={x:0,y:-1};
  if(d==="down"&&dir.y!==-1)dir={x:0,y:1};
  if(d==="left"&&dir.x!==1)dir={x:-1,y:0};
  if(d==="right"&&dir.x!==-1)dir={x:1,y:0};
 }
 document.querySelectorAll("[data-dir]").forEach(b=>{
  b.addEventListener("pointerdown",()=>direction(b.dataset.dir));
 });
 function draw(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,320,320);
  ctx.fillStyle="#ff3048";
  ctx.fillRect(food.x*20,food.y*20,18,18);
  ctx.fillStyle="#28dc75";
  snake.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18));
 }
 function move(){
  if(!alive)return;
  let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=16||h.y<0||h.y>=16||
   snake.some(p=>p.x===h.x&&p.y===h.y)){
   alive=false;clearInterval(timer);
   document.getElementById("message").textContent="Game over! Score: "+score;
   return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
   score++;
   do{
    food={x:Math.floor(Math.random()*16),y:Math.floor(Math.random()*16)};
   }while(snake.some(p=>p.x===food.x&&p.y===food.y));
  }else snake.pop();
  document.getElementById("message").textContent="Score: "+score;
  draw();
 }
 function key(e){
  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  if(map[e.key]){e.preventDefault();direction(map[e.key]);}
 }
 document.addEventListener("keydown",key);
 cleanup=()=>document.removeEventListener("keydown",key);
 draw();timer=setInterval(move,140);
}

function startReaction(){
 showGame("Reaction Test","Wait until the screen turns green. Then tap it!");
 let ready=false,finished=false,start=0;
 ctx.fillStyle="#9c172d";ctx.fillRect(0,0,320,320);
 document.getElementById("message").textContent="Wait...";
 const delay=setTimeout(()=>{
  if(game!=="Reaction")return;
  ready=true;start=Date.now();
  ctx.fillStyle="#15934a";ctx.fillRect(0,0,320,320);
  document.getElementById("message").textContent="TAP NOW!";
 },1500+Math.random()*3000);
 function tap(){
  if(finished)return;
  if(!ready){
   clearTimeout(delay);
   finished=true;
   document.getElementById("message").textContent="Too early! Try again.";
   return;
  }
  finished=true;
  document.getElementById("message").textContent=
   "Your reaction time: "+(Date.now()-start)+" ms!";
 }
 canvas.onclick=tap;
 cleanup=()=>{clearTimeout(delay);canvas.onclick=null;};
}

function startPong(){
 showGame("Pong","Move your finger up and down to control your paddle.");
 let py=130;
 let ball={x:160,y:160,vx:3,vy:2};
 let score=0;
 function control(e){
  let r=canvas.getBoundingClientRect();
  py=Math.max(0,Math.min(260,(e.clientY-r.top)*320/r.height-30));
 }
 canvas.onpointermove=control;
 function draw(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,320,320);
  ctx.fillStyle="white";
  ctx.fillRect(12,py,10,60);
  ctx.fillRect(298,ball.y-25,10,50);
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,7,0,Math.PI*2);
  ctx.fill();
 }
 function tick(){
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.y<7||ball.y>313)ball.vy*=-1;
  if(ball.vx<0&&ball.x<22&&ball.y>py-7&&ball.y<py+67){
   ball.vx=Math.abs(ball.vx);score++;
  }
  if(ball.x>288&&ball.y>ball.y-25&&ball.y<ball.y+25)ball.vx=-Math.abs(ball.vx);
  if(ball.x>320){
   clearInterval(timer);
   document.getElementById("message").textContent="Game over! Score: "+score;
   return;
  }
  if(ball.x<0){ball.x=160;ball.y=160;}
  document.getElementById("message").textContent="Score: "+score;
  draw();
 }
 cleanup=()=>{canvas.onpointermove=null;};
 draw();timer=setInterval(tick,25);
}

function startTap(){
 showGame("Tap Challenge","Tap the button as many times as possible in 10 seconds!");
 let score=0,time=10,finished=false;
 ctx.fillStyle="#111";ctx.fillRect(0,0,320,320);
 const c=document.getElementById("controls");
 c.innerHTML='<button id="tapButton" style="font-size:22px;padding:25px">TAP ME!</button>';
 const b=document.getElementById("tapButton");
 b.onclick=()=>{
  if(finished)return;
  score++;
  document.getElementById("message").textContent="Taps: "+score+" | Time: "+time;
 };
 document.getElementById("message").textContent="Time: 10";
 timer=setInterval(()=>{
  time--;
  document.getElementById("message").textContent="Taps: "+score+" | Time: "+time;
  if(time<=0){
   clearInterval(timer);finished=true;
   document.getElementById("message").textContent="Finished! Your score: "+score;
  }
 },1000);
}
</script>
</body>
</html>
