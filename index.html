
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>CARTER ARCADE</title>
<style>
:root {
  --bg:#090909;
  --panel:#151515;
  --red:#ff263b;
  --muted:#999;
  --border:#292929;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial, sans-serif;
}
header {
  padding:24px 5%;
  border-bottom:1px solid var(--border);
  background:#101010;
  position:sticky;
  top:0;
  z-index:10;
}
.brand {
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}
.brand span {color:var(--red)}
header p {color:var(--muted);font-size:12px}
.hero {
  padding:45px 5% 25px;
}
.hero h1 {font-size:clamp(30px,6vw,55px);margin:0}
.hero h1 span {color:var(--red)}
.hero p {color:var(--muted)}
.search {
  display:flex;
  gap:10px;
  padding:0 5%;
  flex-wrap:wrap;
}
input {
  flex:1;
  min-width:180px;
  background:#181818;
  color:white;
  border:1px solid var(--border);
  padding:15px;
  border-radius:10px;
  font-size:16px;
}
button {
  cursor:pointer;
  border:1px solid var(--border);
  border-radius:9px;
  background:#1b1b1b;
  color:white;
  padding:11px 16px;
  font-size:14px;
}
button:hover,.category.active {
  background:var(--red);
  border-color:var(--red);
}
.categories {
  display:flex;
  gap:9px;
  padding:22px 5%;
  overflow-x:auto;
}
.categories button {white-space:nowrap}
main {padding:5px 5% 50px}
.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.section-title h2 {font-size:21px}
#count {color:var(--muted);font-size:13px}
.games {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:17px;
}
.game {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  transition:.2s;
}
.game:hover {
  transform:translateY(-4px);
  border-color:var(--red);
}
.thumbnail {
  width:100%;
  aspect-ratio:16/10;
  display:grid;
  place-items:center;
  font-size:48px;
  background:linear-gradient(135deg,#252525,#101010);
}
.game-info {padding:12px}
.game-info h3 {font-size:15px;margin:0 0 7px}
.game-info p {font-size:12px;color:var(--muted);margin:0 0 12px}
.play {
  width:100%;
  background:var(--red);
  border:0;
  font-weight:bold;
}
.empty {
  display:none;
  color:var(--muted);
  text-align:center;
  padding:50px 10px;
}
footer {
  padding:30px 5%;
  text-align:center;
  color:var(--muted);
  border-top:1px solid var(--border);
  font-size:12px;
}
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:#000e;
  z-index:30;
  padding:12px;
  align-items:center;
  justify-content:center;
}
.modal.open {display:flex}
.modal-box {
  width:100%;
  max-width:1000px;
  height:90vh;
  background:#111;
  border:1px solid var(--red);
  border-radius:14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modal-head {
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.modal-head strong {font-size:16px}
iframe {
  border:0;
  width:100%;
  flex:1;
  background:white;
}
@media(max-width:500px) {
  .games {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .game-info {padding:9px}
  .hero {padding-top:30px}
  header {padding:18px 5%}
}
</style>
</head>
<body>

<header>
  <div class="brand">CARTER<span> ARCADE</span></div>
  <p>YOUR NEXT GAME STARTS HERE</p>
</header>

<section class="hero">
  <h1>PLAY <span>MORE.</span><br>DISCOVER MORE.</h1>
  <p>Discover games. Pick your favourite. Start playing.</p>
</section>

<div class="search">
  <input id="search" type="search"
    placeholder="Search games..."
    aria-label="Search games">
  <button onclick="clearSearch()">CLEAR</button>
</div>

<nav class="categories" id="categories">
  <button class="category active" data-category="All">All games</button>
  <button class="category" data-category="Arcade">Arcade</button>
  <button class="category" data-category="Puzzle">Puzzle</button>
  <button class="category" data-category="Action">Action</button>
  <button class="category" data-category="Sports">Sports</button>
  <button class="category" data-category="Casual">Casual</button>
</nav>

<main>
  <div class="section-title">
    <h2>ALL GAMES</h2>
    <span id="count"></span>
  </div>
  <div class="games" id="games"></div>
  <div class="empty" id="empty">
    <h2>No games found</h2>
    <p>Try another search or category.</p>
  </div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="gameTitle">GAME</strong>
      <button onclick="closeGame()">CLOSE ✕</button>
    </div>
    <iframe id="gameFrame"
      title="Game window"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen></iframe>
  </div>
</div>

<footer>
  CARTER ARCADE · BUILT FOR GAMERS<br><br>
  Only games with authorised playable hosting are listed.
</footer>

<script>
const games = [
  {
    name:"2048",
    category:"Puzzle",
    icon:"🔢",
    description:"Merge numbers to reach 2048",
    url:"https://play2048.co/"
  },
  {
    name:"HexGL",
    category:"Arcade",
    icon:"🏎️",
    description:"Futuristic racing game",
    url:"https://hexgl.bkcore.com/"
  },
  {
    name:"Tetris",
    category:"Puzzle",
    icon:"🧩",
    description:"Classic block puzzle",
    url:"https://tetris.com/play-tetris"
  },
  {
    name:"Pac-Man",
    category:"Arcade",
    icon:"👾",
    description:"Classic maze game",
    url:"https://www.google.com/logos/2010/pacman10-i.html"
  },
  {
    name:"Little Alchemy 2",
    category:"Puzzle",
    icon:"⚗️",
    description:"Combine elements",
    url:"https://littlealchemy2.com/"
  },
  {
    name:"Cookie Clicker",
    category:"Casual",
    icon:"🍪",
    description:"Build your cookie empire",
    url:"https://orteil.dashnet.org/cookieclicker/"
  },
  {
    name:"2048 Cupcakes",
    category:"Puzzle",
    icon:"🧁",
    description:"A colourful number puzzle",
    url:"https://www.2048cupcakes.com/"
  },
  {
    name:"Slither.io",
    category:"Arcade",
    icon:"🐍",
    description:"Multiplayer snake game",
    url:"https://slither.io/"
  },
  {
    name:"A Dark Room",
    category:"Adventure",
    icon:"🌑",
    description:"Minimalist adventure",
    url:"https://adarkroom.doublespeakgames.com/"
  },
  {
    name:"Chess",
    category:"Puzzle",
    icon:"♟️",
    description:"Play chess online",
    url:"https://www.chess.com/play/computer"
  }
];

let activeCategory = "All";

const gamesContainer = document.getElementById("games");
const searchInput = document.getElementById("search");

function renderGames() {
  const query = searchInput.value.toLowerCase();

  const filtered = games.filter(game => {
    const matchesName =
      game.name.toLowerCase().includes(query);

    const matchesCategory =
      activeCategory === "All" ||
      game.category === activeCategory;

    return matchesName && matchesCategory;
  });

  gamesContainer.innerHTML = "";

  filtered.forEach(game => {
    const card = document.createElement("article");
    card.className = "game";

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";
    thumbnail.textContent = game.icon;

    const info = document.createElement("div");
    info.className = "game-info";

    const title = document.createElement("h3");
    title.textContent = game.name;

    const description = document.createElement("p");
    description.textContent = game.category + " · " + game.description;

    const play = document.createElement("button");
    play.className = "play";
    play.textContent = "PLAY NOW";

    play.addEventListener("click", () => openGame(game));

    info.append(title, description, play);
    card.append(thumbnail, info);
    gamesContainer.appendChild(card);
  });

  document.getElementById("count").textContent =
    filtered.length + " GAMES";

  document.getElementById("empty").style.display =
    filtered.length ? "none" : "block";
}

function openGame(game) {
  const modal = document.getElementById("modal");
  const frame = document.getElementById("gameFrame");

  document.getElementById("gameTitle").textContent =
    game.name;

  frame.src = game.url;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeGame() {
  document.getElementById("modal").classList.remove("open");
  document.getElementById("gameFrame").src = "about:blank";
  document.body.style.overflow = "";
}

function clearSearch() {
  searchInput.value = "";
  activeCategory = "All";

  document.querySelectorAll(".category").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === "All"
    );
  });

  renderGames();
}

searchInput.addEventListener("input", renderGames);

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    activeCategory = button.dataset.category;

    document.querySelectorAll(".category").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    renderGames();
  });
});

document.getElementById("modal").addEventListener("click", event => {
  if (event.target.id === "modal") closeGame();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeGame();
});

renderGames();
</script>

</body>
</html>
